name: Coreboot4All CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src tests
      - name: Run unit tests
        run: pytest -q --cov=cb4a
      - name: Validate device records
        run: cb4a validate --strict

  build-and-repro:
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Build builder image
        run: docker build -f docker/builder.Dockerfile -t cb4a/builder:26.09 .
      - name: Fetch pinned coreboot sources
        run: make fetch
      - name: Build QEMU Q35 online and boot test
        run: |
          make build ID=emulation_qemu_q35
          make qemu-test
          cp out/builds/emulation_qemu_q35/SHA256SUMS /tmp/SHA256SUMS.first
      - name: Rebuild offline and assert identical SHA-256
        run: |
          make offline ID=emulation_qemu_q35
          diff -u /tmp/SHA256SUMS.first out/builds/emulation_qemu_q35/SHA256SUMS

  catalog-pages:
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cb4a
        run: pip install -e .
      - name: Generate static catalog
        run: |
          cb4a catalog --out site
          ! grep -qi "<script" site/index.html site/tier-d.html site/devices/*.html
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: catalog-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
